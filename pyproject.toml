[project]
name = "mojo-pyod"
version = "0.1.0"
description = "Compute-heavy PyOD detectors implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "pyod"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:algorithm parameter is deprecated:FutureWarning",
]
